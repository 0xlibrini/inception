
worker_processes auto;

events{
    worker_connections 1024;
    multi_accept on;
}

http{

    server{

        listen 443 ssl;
        server_name anlibrin.42.fr

        ssl_certificate  /etc/nginx/ssl/inception.crt
        ssl_certificate_key /etc/nginx/ssl/inception.key
        ssl_protocol TLSv1.2 TLSv1.2
    }
}